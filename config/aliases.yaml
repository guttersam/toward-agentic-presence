# Feature alias map for canonicalization
# Format: namespace → entity → canonical feature + aliases
# Add entries as new agents, projects, and motifs are introduced.

# Replace these examples with your agent's real aliases.
# Each entry maps raw extracted strings to a stable canonical feature.

agents:
  collaborator_a:
    canonical: agent:collaborator_a
    aliases:
      - Collaborator A
      - collaborator_a
      - CA
  user:
    canonical: agent:user
    aliases:
      - User
      - user
      - the user
  external_agent:
    canonical: agent:external_agent
    aliases:
      - External Agent
      - external_agent

projects:
  phase1:
    canonical: project:phase1_artifact
    aliases:
      - Phase 1
      - 48-hour build
      - artifact threshold
      - phase 1 build
  research_paper:
    canonical: project:agentic_presence_paper
    aliases:
      - the paper
      - toward agentic presence
      - the architecture paper

motifs:
  transmission:
    canonical: motif:transmission
    aliases:
      - signal
      - public transmission
      - emission
      - transmit
  example_motif:
    canonical: motif:example_motif
    aliases:
      - example motif
      - the example

drives:
  completion: drive:completion
  seeking: drive:seeking
  contact: drive:contact
  transmission: drive:transmission
